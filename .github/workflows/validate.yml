name: validate dataset

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: [self-hosted, macOS, ARM64, office]
    steps:
      - uses: actions/checkout@v4
      - name: Validate dataset
        shell: bash
        run: |
          NODE_BIN="/path/to/project"
          if [[ -x "$NODE_BIN" ]]; then
            "$NODE_BIN" scripts/validate.mjs
          else
            npm run validate
          fi
