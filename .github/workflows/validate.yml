name: validate dataset

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: [self-hosted, macOS, ARM64, office]
    steps:
      - uses: actions/checkout@v4
      - name: Lint, test, and validate
        shell: bash
        run: |
          NODE_BIN="/Users/zoyen/actions-runner-3/externals.2.338.2/node24/bin/node"
          if [[ -x "$NODE_BIN" ]]; then
            "$NODE_BIN" scripts/lint.mjs
            "$NODE_BIN" scripts/validate.mjs
            "$NODE_BIN" --test test
          else
            npm run check
          fi
