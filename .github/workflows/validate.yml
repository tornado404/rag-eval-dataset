name: validate dataset

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: [self-hosted, macOS, ARM64, office]
    steps:
      - uses: actions/checkout@v4
      - name: Lint, test, and validate
        shell: bash
        run: |
          NODE_BIN="/path/to/project"
          if [[ -x "$NODE_BIN" ]]; then
            export PATH="$(dirname "$NODE_BIN"):$PATH"
          fi
          npm run check
