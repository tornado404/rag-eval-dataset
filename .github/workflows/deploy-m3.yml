name: deploy-m3

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: '部署的分支/tag/SHA（默认 main）'
        required: false
        default: 'main'

concurrency:
  group: rag-eval-dataset-m3-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, macOS, ARM64, office]
    timeout-minutes: 20
    steps:
      - name: Resolve deploy ref
        id: ref
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.value }}

      - name: Deploy to M3
        shell: bash
        run: bash deploy/deploy-m3.sh

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Private deployment"
            echo ''
            echo '- Target revision: `${{ steps.ref.outputs.value }}`'
            echo '- Health check completed on the configured deployment runner.'
          } >> "$GITHUB_STEP_SUMMARY"
